<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="144" viewBox="0 0 1280 144" role="img" aria-label="Animated status bar: build, break, fix, repeat">
<title>The experiment never ends</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0C172C"/><stop offset="1" stop-color="#162745"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#6AF4DF"/><stop offset=".5" stop-color="#A998FF"/><stop offset="1" stop-color="#6AF4DF"/></linearGradient><style>@keyframes blink{0%,100%{opacity:.95}50%{opacity:.25}}@keyframes move{to{stroke-dashoffset:-90}}.dot{animation:blink 2s ease-in-out infinite}.line{stroke-dasharray:14 13;animation:move 3s linear infinite}</style></defs>
<rect x="2" y="2" width="1276" height="140" rx="17" fill="url(#bg)" stroke="#31476B" stroke-width="2"/>
<circle class="dot" cx="42" cy="37" r="6" fill="#6AF4DF"/>
<text x="60" y="43" font-family="Consolas,monospace" font-size="18" letter-spacing="1.6" font-weight="700" fill="#76F0E0">DEV CONSOLE  /  ONLINE</text>
<text x="43" y="97" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="800" letter-spacing="-1" fill="#F2F6FF">BUILD<tspan fill="#6AF4DF">.</tspan> BREAK<tspan fill="#A998FF">.</tspan> FIX<tspan fill="#6AF4DF">.</tspan> REPEAT<tspan fill="#A998FF">_</tspan></text>
<text x="1230" y="44" font-family="Consolas,monospace" font-size="15" text-anchor="end" fill="#9BB3D1">[ EXPERIMENT #∞ ]</text>
<text x="1230" y="92" font-family="Consolas,monospace" font-size="17" text-anchor="end" fill="#B6C9E0">STATUS: LEARNING</text>
<line x1="42" y1="123" x2="1235" y2="123" stroke="#2D4765" stroke-width="3"/>
<line class="line" x1="42" y1="123" x2="1235" y2="123" stroke="url(#accent)" stroke-width="3"/>
</svg>