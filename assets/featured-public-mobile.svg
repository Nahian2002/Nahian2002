<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1480" viewBox="0 0 700 1480" role="img" aria-label="Four projects: NightWave, COSMO, HomeLab and CENQRO">
<title>Selected engineering work — mobile layout</title><style>
/* Subtle SVG-only motion; icons remain visible if animation is unavailable. */
@keyframes nw-equalizer { 0%,100% { transform:scaleY(1); } 35% { transform:scaleY(.42); } 68% { transform:scaleY(.82); } }
.nw-wave { transform-box:fill-box; transform-origin:center; animation:nw-equalizer 3.4s ease-in-out infinite; }
@keyframes cosmo-rotate { to { transform:rotate(360deg); } }
.cosmo-spokes { transform-box:fill-box; transform-origin:center; animation:cosmo-rotate 32s linear infinite; }
@keyframes core-glow { 0%,100% { opacity:1; } 50% { opacity:.56; } }
.cosmo-core { animation:core-glow 4.5s ease-in-out infinite; }
@keyframes server-status { 0%,100% { opacity:1; } 52% { opacity:.36; } }
.server-led { animation:server-status 3.6s ease-in-out infinite; }
@keyframes meridian-turn { 0%,100% { transform:scaleX(1); } 50% { transform:scaleX(.23); } }
.cenqro-meridian { transform-box:fill-box; transform-origin:center; animation:meridian-turn 11s ease-in-out infinite; }
@keyframes latitude-drift { 0%,100% { transform:rotate(-7deg); } 50% { transform:rotate(7deg); } }
.cenqro-latitude { transform-box:fill-box; transform-origin:center; animation:latitude-drift 15s ease-in-out infinite; }
.cenqro-point { animation:core-glow 5s ease-in-out infinite; }
@media (prefers-reduced-motion:reduce) {
 .nw-wave,.cosmo-spokes,.cosmo-core,.server-led,.cenqro-meridian,.cenqro-latitude,.cenqro-point { animation:none !important; transform:none !important; opacity:1 !important; }
}
