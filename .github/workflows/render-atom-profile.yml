name: Render 60 FPS profile atom showcase

on:
  push:
    branches:
      - profile/atom-motion-60fps-apng
    paths:
      - tools/render_featured_atom.py
      - .github/workflows/render-atom-profile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout profile branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install renderer
        run: python -m pip install 'Pillow>=10.4,<12' 'CairoSVG>=2.7,<3'

      - name: Render exact 60 FPS APNG and GIF fallbacks
        run: python tools/render_featured_atom.py

      - name: Commit verified assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/featured-atom60-desktop.png assets/featured-atom60-mobile.png
          git add assets/featured-atom60-desktop.gif assets/featured-atom60-mobile.gif
          if ! git diff --cached --quiet; then
            git commit -m "assets: render atom showcase in APNG and GIF"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
