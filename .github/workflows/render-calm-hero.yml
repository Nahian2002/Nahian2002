name: Render calm high-resolution CORE LAB hero

on:
  push:
    branches:
      - profile/hero-calm-float-hires-v8
    paths:
      - tools/render_hero_double_spin.py
      - assets/hero-premium-dark.svg
      - assets/hero-premium-light.svg
      - .github/workflows/render-calm-hero.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rendering dependencies
        run: python -m pip install 'Pillow>=10.4,<12' 'CairoSVG>=2.7,<3'

      - name: Render 60 FPS WebP and 50 FPS GIF in native 1280x390
        run: python -u tools/render_hero_double_spin.py

      - name: Verify generated animation files
        run: |
          ls -lh assets/hero-core-calm-hires-*
          test "$(find assets -maxdepth 1 -name 'hero-core-calm-hires-*' | wc -l)" -eq 4

      - name: Commit and push verified assets without losing concurrent updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-core-calm-hires-*.webp assets/hero-core-calm-hires-*.gif
          if ! git diff --cached --quiet; then
            git commit -m "assets: render calmer high-resolution floating CORE LAB hero"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
