name: Render CORE LAB double-spin hero

on:
  push:
    branches:
      - profile/hero-core-double-orbits-v7
    paths:
      - tools/render_hero_double_spin.py
      - assets/hero-premium-dark.svg
      - assets/hero-premium-light.svg
      - .github/workflows/render-core-hero.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install renderer dependencies
        run: python -m pip install 'Pillow>=10.4,<12' 'CairoSVG>=2.7,<3'

      - name: Render 60 FPS WebP and 50 FPS GIF heroes
        run: python tools/render_hero_double_spin.py

      - name: Verify generated asset sizes
        run: |
          ls -lh assets/hero-core-double-spin-*
          test "$(find assets -maxdepth 1 -name 'hero-core-double-spin-*' | wc -l)" -eq 4

      - name: Commit verified assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-core-double-spin-*.webp assets/hero-core-double-spin-*.gif
          if ! git diff --cached --quiet; then
            git commit -m "assets: add CORE LAB double-spin profile hero motion"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
