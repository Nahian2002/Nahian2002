name: Render featured profile GIFs

on:
  push:
    branches:
      - profile/fix-motion-with-gif-assets
    paths:
      - tools/render_featured_motion.py
      - .github/workflows/build-featured-gifs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install render dependencies
        run: python -m pip install 'Pillow>=10.4,<12' 'CairoSVG>=2.7,<3'

      - name: Render GIFs and validate frame counts
        run: python tools/render_featured_motion.py

      - name: Commit generated GIFs to the current branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/featured-animated-desktop.gif assets/featured-animated-mobile.gif
          if ! git diff --cached --quiet; then
            git commit -m "assets: render GitHub-safe animated project cards"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
