name: Render ultra-smooth featured profile GIFs

on:
  push:
    branches:
      - profile/ultra-smooth-four-card-gifs
    paths:
      - tools/render_featured_motion.py
      - .github/workflows/render-ultrasmooth-profile.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install image render dependencies
        run: python -m pip install 'Pillow>=10.4,<12' 'CairoSVG>=2.7,<3'

      - name: Render and validate 96 frame GIFs
        run: python tools/render_featured_motion.py

      - name: Save generated animations on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/featured-ultrasmooth-desktop.gif assets/featured-ultrasmooth-mobile.gif
          if ! git diff --cached --quiet; then
            git commit -m "assets: add ultra-smooth profile project animations"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
